# mbnas-runner (public): job lifecycle and training/evaluation/benchmark handlers. WP-1 contract §2 / DD-A1(c) / DD-A24.
[build-system]
requires = ["setuptools>=69,<81", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mbnas-runner"
version = "0.1.0"
description = "MBNAS runner: job lifecycle and training/evaluation/benchmark handlers"
requires-python = ">=3.10,<3.11"
dependencies = [
  "mbnas-contracts==0.1.0",
  "mbnas-model-runtime==0.1.0",
  "pydantic-settings",
  "httpx",
  "psutil",
  "nvidia-ml-py",
  "python-dotenv",
]

[project.scripts]
mbnas-runner = "mbnas_runner.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mbnas_runner", "mbnas_runner.*"]
