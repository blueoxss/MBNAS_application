# nginx EXAMPLE - HTTPS in front of the MBNAS gateway (127.0.0.1:8710), which serves both the web console (/) and the
# user API (/api/...) on one origin, so no CORS entry is needed. Adapt server_name and the certificate paths.
# Install: /etc/nginx/conf.d/mbnas-gateway.conf, then `nginx -t && systemctl reload nginx`.

server {
    listen 80;
    server_name mbnas.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;              # nginx >= 1.25.1 prefers `listen 443 ssl;` + `http2 on;` (same effect)
    server_name mbnas.example.org;

    ssl_certificate     /etc/ssl/certs/mbnas.example.org.crt;
    ssl_certificate_key /etc/ssl/private/mbnas.example.org.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # the gateway enforces its own limits (1 MiB API bodies, MBNAS_GW_UPLOAD_MAX_BYTES uploads); this only caps them
    client_max_body_size 20m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # Server-sent events of a run: no buffering, long read timeout (heartbeat comment every 15 s)
    location ~ ^/api/v1/runs/[^/]+/events$ {
        proxy_pass http://127.0.0.1:8710;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8710;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;           # synchronous validation / structure checks are relayed to the core
        proxy_request_buffering off;       # stream uploads to the gateway, which applies the size limits
    }

    # web console (static files and SPA routes, served by the gateway)
    location / {
        proxy_pass http://127.0.0.1:8710;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # bearer tokens travel in the Authorization header (never logged by this format); signed artifact URLs carry
    # only exp/sig
    access_log /var/log/nginx/mbnas-gateway.access.log;
}

