# mbnas-server (public): user-facing API gateway and read-only archive. WP-1 contract §2 / DD-A1(e) / DD-A24.
[build-system]
requires = ["setuptools>=69,<81", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mbnas-server"
version = "0.1.0"
description = "MBNAS gateway: user-facing API gateway and read-only archive"
requires-python = ">=3.10,<3.11"
dependencies = [
  "mbnas-contracts==0.1.0",
  # WP-3B: validate pre-processing builds dataset manifests on the gateway host (imported lazily)
  "mbnas-model-runtime==0.1.0",
  "fastapi",
  "uvicorn[standard]",
  "pydantic-settings",
  "httpx",
  "python-dotenv",
  "jsonschema",
]

[project.optional-dependencies]
# DD-A29: NVML for the archive / live GPU views
gpu = ["nvidia-ml-py==13.615.71"]

[project.scripts]
mbnas-gateway = "mbnas_server.api.app:main"
mbnas-gateway-doctor = "mbnas_server.doctor:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mbnas_server", "mbnas_server.*"]
