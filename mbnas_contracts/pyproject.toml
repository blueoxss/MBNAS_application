# mbnas-contracts (public): DTO schemas, OpenAPI contract data, job-protocol types and stdlib helpers.
# WP-1 contract §2 / DD-A10 / DD-A24: version is the literal of the repository VERSION file (no dynamic read).
[build-system]
requires = ["setuptools>=69,<81", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mbnas-contracts"
version = "0.1.0"
description = "MBNAS Research Console shared contracts: DTO schemas, OpenAPI contract data, job protocol types and stdlib helpers"
requires-python = ">=3.10,<3.11"
dependencies = [
  "pydantic==2.13.5",
  "PyYAML==6.0.3",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["mbnas_contracts", "mbnas_contracts.*"]

[tool.setuptools.package-data]
"mbnas_contracts.openapi" = ["openapi.json", "HISTORY.json", "openapi_runner.json"]
